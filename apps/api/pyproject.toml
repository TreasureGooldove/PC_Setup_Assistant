[project]
name = "pc-setup-assistant-api"
version = "0.1.0"
description = "API and worker for a guided PC setup assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.15.2",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "openai>=1.59.7",
  "openpyxl>=3.1.5",
  "pydantic>=2.10.5",
  "pydantic-settings>=2.7.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "ruff>=0.9.2",
  "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
